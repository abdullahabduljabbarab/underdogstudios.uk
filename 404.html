<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcel Lost · Underdog Studios</title>
<link rel="icon" type="image/png" href="/media/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@900&family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root { --stock: #ECE6D8; --ink: #121010; --crimson: #B11C26; --faded: #6B645A; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--stock); color: var(--ink); font: 500 16px/1.5 "IBM Plex Mono", Consolas, monospace; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.box { text-align: center; max-width: 640px; display: grid; justify-items: center; gap: 14px; }
.box img { width: 170px; border: 5px solid var(--ink); border-radius: 22%; transform: rotate(-5deg); box-shadow: 8px 9px 0 var(--ink); animation: drop .6s cubic-bezier(.3,1.3,.5,1) backwards; }
h1 { margin: 18px 0 0; font: 900 clamp(110px, 26vw, 220px)/.8 "Big Shoulders Stencil Display", Impact, sans-serif; }
h2 { margin: 0; font: 900 clamp(34px, 7vw, 56px)/.9 "Big Shoulders Stencil Display", Impact, sans-serif; text-transform: uppercase; color: var(--crimson); }
p { margin: 0; color: var(--faded); letter-spacing: .04em; }
.stamp { display: inline-block; border: 4px solid var(--crimson); color: var(--crimson); font: 900 26px/1 "Big Shoulders Stencil Display", Impact, sans-serif; text-transform: uppercase; padding: 8px 12px 6px; transform: rotate(-6deg); }
a { margin-top: 10px; font: 800 22px/1 "Big Shoulders Display", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; background: var(--ink); color: var(--stock); padding: 15px 22px 13px; box-shadow: 4px 4px 0 var(--crimson); }
a:hover { background: var(--crimson); }
@keyframes drop { from { transform: translateY(-40px) rotate(-14deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .box img { animation: none; } }
</style>
</head>
<body>
  <div class="box">
    <img src="/media/logo-small.webp" alt="The Underdog Studios bulldog">
    <h1>404</h1>
    <h2>This parcel got lost</h2>
    <span class="stamp">Return to sender</span>
    <p>The page you were after isn't here. No questions asked.</p>
    <a href="/">Back to base</a>
  </div>
</body>
</html>
